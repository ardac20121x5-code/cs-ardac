name: Build CloudStream3 Plugin

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Generate CS3 Plugin
      run: |
        mkdir -p build/cs3
        cd build/libs
        for jar in *.jar; do
          [ -f "$jar" ] && cp "$jar" ../cs3/cs-ardac.cs3
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cs-ardac-plugin
        path: build/cs3/
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/cs3/cs-ardac.cs3
        body: |
          CloudStream3 Plugin Build
          
          **Files:**
          - cs-ardac.cs3
          
          **Installation:**
          1. Open CloudStream3
          2. Settings → Extensions → Add Extension
          3. Add repository or upload cs-ardac.cs3 directly
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
